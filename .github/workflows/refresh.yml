# 주 수집기는 맥(launchd, 매일 07:30 KST)이다.
# 깃허브 러너에서는 jeju.go.kr / jejusi.go.kr / seogwipo.go.kr / playjeju.co.kr 에
# 접속이 안 된다(2026-08 확인). 그래서 여기서는 접속되는 소스만 갱신하고
# 나머지는 직전 데이터를 이어받는다. 맥이 며칠 꺼져 있어도 사이트가 멈추지 않게 하는 보조 장치.
name: 제주 행사 자동 수집 (보조)

on:
  schedule:
    - cron: '0 4 * * *'       # 매일 13:00 KST — 맥 실행(07:30)보다 늦게
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: API 키 확인
        env:
          VISITJEJU_API_KEY: ${{ secrets.VISITJEJU_API_KEY }}
        run: |
          if [ -z "$VISITJEJU_API_KEY" ]; then
            echo "::error::VISITJEJU_API_KEY 시크릿이 없습니다."
            echo "Settings → Secrets and variables → Actions 에서 등록한 뒤 다시 실행하세요."
            echo "키 없이 돌리면 비짓제주 800여 건이 빠진 채로 커밋됩니다."
            exit 1
          fi
          echo "키 확인됨."

      - name: 수집 대상 사이트 접속 점검
        run: |
          for h in www.jeju.go.kr www.jejusi.go.kr www.seogwipo.go.kr www.playjeju.co.kr \
                   api.visitjeju.net www.visitjeju.net www.jejunolda.com www.jfac.kr; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$h/" || echo "000")
            printf '  %-24s %s\n' "$h" "$code"
          done

      - name: 수집
        env:
          VISITJEJU_API_KEY: ${{ secrets.VISITJEJU_API_KEY }}
        run: python3 refresh.py

      - name: events.json 생성
        run: python3 build_page.py

      - name: 변경분 커밋
        run: |
          git config user.name  "jeju-events bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json visitjeju_cache.json
          if git diff --staged --quiet; then
            echo "바뀐 게 없습니다."
          else
            git commit -m "행사 데이터 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
