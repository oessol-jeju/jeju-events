name: 제주 행사 자동 수집

on:
  schedule:
    - cron: '0 20 * * *'      # 매일 05:00 (한국시간)
  workflow_dispatch:           # 필요하면 손으로도 실행

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 수집
        env:
          VISITJEJU_API_KEY: ${{ secrets.VISITJEJU_API_KEY }}
        run: python3 refresh.py

      - name: events.json 생성
        run: python3 build_page.py

      - name: 변경분 커밋
        run: |
          git config user.name  "jeju-events bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json visitjeju_cache.json
          if git diff --staged --quiet; then
            echo "바뀐 게 없습니다."
          else
            git commit -m "행사 데이터 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
